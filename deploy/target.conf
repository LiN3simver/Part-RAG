# 這個專案的部署目標定義。deploy/deploy.sh（本機）與 deploy/apply.sh（伺服器）
# 都 source 這一份，兩邊看到的是同一組規則 —— 本機 `plan` 預告的動作，就是伺服器
# 實際會做的動作。要改部署行為改這裡，不要在兩支腳本裡各改一半。
#
# 每一行都可以用同名環境變數覆寫（`T_HOST=other-host bash deploy/deploy.sh plan`），
# 換一台機器不必改檔案。

# ---- 伺服器 ----------------------------------------------------------------
: "${T_HOST:=deploy@app-server.example.com}"
: "${T_REMOTE:=~/apps/Part-RAG}"

# ---- compose ---------------------------------------------------------------
# 主服務：程式碼變更後要重建的那個。
: "${T_SERVICE:=api}"

# 額外服務，格式 `service:profile`（沒有 profile 就寫 `service:`），空白分隔。
# scheduler 掛了 compose profile 而且**預設是暫停的**（見 README 的「資料管線與維運設計」一節），
# 所以 apply.sh 只會更新「已經被建立過」的，不會因為一次部署就把排程開起來 ——
# 部署腳本不該替人做「開始對外連線並寫語料」這種決定。
: "${T_EXTRA_SERVICES:=scheduler:scheduler}"

# build 之前要在伺服器上跑的準備指令（空字串＝不用）。
# 校驗版控中的固定 agentkit 快照並產生 build-info.json；不再從 sibling 自動複製。
: "${T_PREBUILD:=bash docker/vendor_agentkit.sh}"

# ---- 「改了什麼 → 要做什麼」的判斷規則（ERE，比對 git diff --name-only 的輸出）--
#
# T_IMAGE_RE：會被 COPY 進 image 的東西，改了就要 `up --build -d`。
#             跟 Dockerfile 的 COPY 清單一一對應，改 Dockerfile 記得同步這裡。
#             requirements-api.txt 一定要在這裡：api image 裝的就是那一份，
#             漏掉的話「改了 api 的相依」不會觸發重建（requirements.txt 只是
#             靠 -r 引用它，git diff 看到的是被改的那個檔）。
: "${T_IMAGE_RE:=^(main\.py|analyze\.py|src/|vendor/|requirements[^/]*\.(txt|lock)|Dockerfile|docker/)}"

# T_MOUNT_RE：bind mount 進容器的東西，檔案換掉就生效，**不必**重建 image。
#             這個專案的執行期資料走 named volume、不在版控裡，所以預設是空的；
#             有版控檔案 bind mount 進容器時把它的路徑寫在這裡（例：^config/）。
: "${T_MOUNT_RE:=}"

# T_COMPOSE_RE：改了要 `up -d` 讓 compose 重新套設定（不必然要 build）。
: "${T_COMPOSE_RE:=^docker-compose\.yml$}"

# T_MIGRATION_RE：資料庫 schema。**永遠不自動執行** —— DDL 打錯一次要靠 dump 才
#                 救得回來，這種事必須有人看著。命中只會在部署結果印一段提醒。
: "${T_MIGRATION_RE:=^src/migrate\.py$}"
: "${T_MIGRATION_HINT:=docker compose exec -T api python -m src.migrate status   # 看過再 apply}"

# T_NOTE_RE：不影響服務，但改了值得提一句（例如 .env 範本動過，通常代表伺服器的
#            .env 要跟著補）。展示版沒有附範本，預設是空的。
: "${T_NOTE_RE:=}"

# ---- 回滾用的 image 快照 ---------------------------------------------------
# 每次 build 前把正在跑的 image 貼一個 sha 標籤，回滾就不必重 build、不必連外網
# （見 deploy/apply.sh 的 snapshot_image）。主服務與 T_EXTRA_SERVICES 都會快照，
# 回滾時整組一起換 —— 不做局部回滾。保留幾個版本（每個 image 各自算）。
# 標籤不佔額外空間：那些 layer 本來就在磁碟上，只是原本會變成 dangling。
: "${T_IMAGE_KEEP:=5}"

# ---- 部署後的健康檢查 ------------------------------------------------------
# 在伺服器上執行；輸出要 match T_HEALTH_OK_RE 才算過。
# /readyz 必須為 ready：DB/schema/A2A 尚未可用，不能宣告部署成功。
# LLM 離線與同步資料過舊仍由管理狀態顯示，不讓它們阻斷既有檢索。
# port 用 `docker compose port` 現查，不要寫死：compose 綁的是
# `127.0.0.1:${API_PORT:-8000}:8000`，寫死的話 API_PORT 一改，健康檢查就會打到
# 沒人聽的 port —— 症狀是「服務其實好的，但部署被判失敗並自動回滾」。
if [ -z "${T_HEALTH_CMD+x}" ]; then
    T_HEALTH_CMD='curl -fsS --max-time 10 "http://127.0.0.1:$(docker compose port api 8000 | sed "s/.*://")/readyz"'
fi
: "${T_HEALTH_OK_RE:=\"status\"[[:space:]]*:[[:space:]]*\"ready\"}"
# 兩分鐘，讓程序與資料庫檢查完成；schema 缺漏會回 503 並列出缺少的欄位。
: "${T_HEALTH_RETRIES:=24}"
: "${T_HEALTH_INTERVAL:=5}"

# Read actual running image identities and require API/worker versions to agree.
: "${T_RELEASE_CMD:=python3 -m src.delivery release --output \".deploy/releases/\$(date -u +%Y%m%dT%H%M%SZ)-\$(git rev-parse --short HEAD).json\" --services \"\$(deploy_services | paste -sd, -)\"}"

# ---- 跨專案連帶 ------------------------------------------------------------
# 這個專案改了以下路徑時，哪些 sibling 專案要跟著重建（本機 deploy.sh 會問）。
# 這裡是空的：partrag 的程式碼不會被別人 COPY 走。反過來 Agent_Hub_RAG_Frontend 改 agentkit
# 就會連帶到這裡（見 Agent_Hub_RAG_Frontend/deploy/target.conf）。
: "${T_DEPENDENT_RE:=}"
: "${T_DEPENDENT_DIRS:=}"
